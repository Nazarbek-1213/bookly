events {}

http {
    server {
        listen 80;
        client_max_body_size 50M;

        location / {
            proxy_pass http://frontend:80;
        }

        location /user/ {
            proxy_pass http://backend:8000;
        }

        location /post/ {
            proxy_pass http://backend:8000;
        }

        location /auth/ {
            proxy_pass http://backend:8000;
        }

        location /review/ {
            proxy_pass http://backend:8000;
        }

        location /ai/ {
            proxy_pass http://backend:8000;
        }

        location /uploads/ {
            proxy_pass http://backend:8000;
        }
    }
}