<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookgram</title>
<link rel="stylesheet" href="bookly-style.css">
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth" class="hidden">
  <div class="auth-box">
    <div class="card">
      <div class="logo">Bookgram</div>

      <form id="loginForm">
        <input name="username" placeholder="Foydalanuvchi nomi" required autocomplete="username">
        <input name="password" type="password" placeholder="Parol" required autocomplete="current-password">
        <button class="btn" type="submit">Kirish</button>
        <div class="err" id="loginErr"></div>
      </form>

      <form id="regForm" class="hidden">
        <input name="username" placeholder="Foydalanuvchi nomi" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="bio" placeholder="Bio (ixtiyoriy)">
        <input name="password" type="password" placeholder="Parol" required>
        <input name="password2" type="password" placeholder="Parolni takrorlang" required>
        <div class="filepick">
          <img id="regPreview" class="avatar" width="40" height="40" src="">
          <label>Profil rasmi tanlash<input name="file" type="file" accept="image/*"></label>
        </div>
        <button class="btn" type="submit">Ro'yxatdan o'tish</button>
        <div class="err" id="regErr"></div>
      </form>
    </div>
    <div class="card switch">
      <span id="switchText">Akkauntingiz yo'qmi?</span>
      <button class="btn link" id="switchBtn">Ro'yxatdan o'tish</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <nav class="sidebar">
    <div class="logo">Bookgram</div>
    <div class="nav">
      <a href="#/" data-route="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Bosh sahifa</span>
      </a>
      <a href="#/search" data-route="/search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Qidiruv</span>
      </a>
      <button id="navCreate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg><span>Yaratish</span>
      </button>
      <a href="#/profile" data-route="/profile">
        <img id="navAvatar" class="avatar" width="24" height="24" src=""><span>Profil</span>
      </a>
    </div>
    <div class="spacer"></div>
    <div class="nav nav-bottom">
      <a href="#/settings" data-route="/settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Sozlamalar</span>
      </a>
    </div>
  </nav>
  <main><div class="content" id="view"></div></main>
</div>

<div id="modals"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
