<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookgram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login / Register -->
  <section id="auth-screen" class="auth-screen" hidden></section>

  <!-- App layout -->
  <div id="layout" class="layout" hidden>
    <nav id="sidebar" class="sidebar" aria-label="Asosiy menyu">
      <a class="logo" href="#/">Bookgram</a>
      <div class="nav-list">
        <a class="nav-item" href="#/" data-route="/" title="Bosh sahifa">
          <span class="nav-icon" data-icon="home"></span><span class="nav-label">Bosh sahifa</span>
        </a>
        <a class="nav-item" href="#/search" data-route="/search" title="Qidiruv">
          <span class="nav-icon" data-icon="search"></span><span class="nav-label">Qidiruv</span>
        </a>
        <button class="nav-item" type="button" data-action="open-create" title="Yaratish">
          <span class="nav-icon" data-icon="plus"></span><span class="nav-label">Yaratish</span>
        </button>
        <a class="nav-item" href="#/profile" data-route="/profile" title="Profil">
          <span class="nav-icon"><img id="nav-avatar" class="avatar avatar-24" alt="Profil" src=""></span><span class="nav-label">Profil</span>
        </a>
      </div>
      <div class="nav-list nav-bottom">
        <a class="nav-item" href="#/settings" data-route="/settings" title="Sozlamalar">
          <span class="nav-icon" data-icon="settings"></span><span class="nav-label">Sozlamalar</span>
        </a>
      </div>
    </nav>

    <main id="page" class="page"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
